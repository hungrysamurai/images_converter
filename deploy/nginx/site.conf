# convert-it.ru. Ставится через `pnpm nginx:convert-it.ru` в /etc/nginx/projects/convert-it.ru/

map $uri $convert_it_cache_control {
    "~^/assets/.+-[\w-]{8}\."  "public, max-age=31536000, immutable";  # файлы с хешем в имени
    default                    "no-cache";                             # HTML и остальное
}

server {
    listen 80;
    server_name convert-it.ru www.convert-it.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://convert-it.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.convert-it.ru;

    include /etc/nginx/projects/convert-it.ru/tls.inc;

    return 301 https://convert-it.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name convert-it.ru;

    include /etc/nginx/projects/convert-it.ru/tls.inc;

    root /var/www/convert-it.ru;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Cache-Control $convert_it_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain application/xml;
}
